version: '3.9'
services:
  web:
    build: .
    environment:
      NODE_ENV: production
      AUTH_COOKIE_DOMAIN: .madabase.com
    command: npm run start --workspace apps/web
    expose:
      - '3000'

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_TEST_SITE_URL: https://test.madabase.com
      NEXT_PUBLIC_MAIN_SITE_URL: https://madabase.com
      AUTH_COOKIE_DOMAIN: .madabase.com
    command: npm run start --workspace apps/test
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - test
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
