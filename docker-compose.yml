version: '3.9'
services:
  main:
    build: .
    environment:
      NODE_ENV: production
      AUTH_COOKIE_DOMAIN: .madabase.com
    command: npm run start --workspace apps/main
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - main
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
