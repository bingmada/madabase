<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">PuraMax 2: cat eligibility and bundle boundaries</title><desc id="desc">The reviewed PuraMax 2 manual recommends against use below six months or 1.5 kilograms. Smart Spray is premium-package specific.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153c37}.title{font-size:40px;font-weight:700}.label{font-size:25px;font-weight:700;fill:#2a7067}.body{font-size:28px}.small{font-size:23px}.large{font-size:43px;font-weight:700}.line{fill:none;stroke:#2a7067;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.box{fill:white;stroke:#cbbdbd;stroke-width:2}.accent{fill:#2a7067}</style><rect width="900" height="560" rx="20" fill="#f3f9f6"/><text x="40" y="45" class="label">EDITORIAL DECISION DIAGRAM</text><text x="40" y="105" class="title">PuraMax 2: qualify the cat and package</text><rect x="40" y="145" width="395" height="170" rx="14" class="box"/><text x="65" y="190" class="label">AGE GUIDANCE</text><text x="65" y="255" class="large">&gt; 6 months</text><rect x="465" y="145" width="395" height="170" rx="14" class="box"/><text x="490" y="190" class="label">WEIGHT GUIDANCE</text><text x="490" y="255" class="large">At least 1.5 kg</text><text x="40" y="362" class="body">Kitten Mode does not waive the overall eligibility limits.</text><rect x="40" y="393" width="820" height="95" rx="14" class="box"/><text x="65" y="431" class="label">CHECK THE RECEIVED BUNDLE</text><text x="65" y="469" class="body">Smart Spray: premium only • N50 is a separate module</text><text x="40" y="529" class="small">Documentation guide • not a product photograph or hands-on test</text></svg>
