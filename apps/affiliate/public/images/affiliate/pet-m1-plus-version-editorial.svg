<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">M1 Plus: match the received version</title><desc id="desc">Current Plus catalog capacities and the older linked M1 document are separate references. Exact Plus instructions remain a check.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153c37}.title{font-size:40px;font-weight:700}.label{font-size:25px;font-weight:700;fill:#2a7067}.body{font-size:28px}.small{font-size:23px}.large{font-size:43px;font-weight:700}.line{fill:none;stroke:#2a7067;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.box{fill:white;stroke:#cbbdbd;stroke-width:2}.accent{fill:#2a7067}</style><rect width="900" height="560" rx="20" fill="#f3f9f6"/><text x="40" y="45" class="label">EDITORIAL DECISION DIAGRAM</text><text x="40" y="105" class="title">M1 Plus: keep the documents separate</text><rect x="40" y="145" width="395" height="245" rx="14" class="box"/><text x="65" y="190" class="label">CURRENT PLUS CATALOG</text><text x="65" y="250" class="large">7.17 L / 11.23 L</text><text x="65" y="294" class="body">Litter / waste figures</text><text x="65" y="341" class="body">Current Plus reference</text><rect x="465" y="145" width="395" height="245" rx="14" class="box"/><text x="490" y="190" class="label">OLDER LINKED M1 MANUAL</text><text x="490" y="250" class="large">6.5 L / 11 L</text><text x="490" y="294" class="body">Original-family figures</text><text x="490" y="341" class="body">Exact Plus match unknown</text><path d="M40 423h820" class="line"/><text x="40" y="465" class="body">Match the received label, applicable manual and cat eligibility.</text><text x="40" y="498" class="small">Do not combine capacities, accessory rules or warranty periods.</text><text x="40" y="529" class="small">Documentation guide • not a product photograph or hands-on test</text></svg>
