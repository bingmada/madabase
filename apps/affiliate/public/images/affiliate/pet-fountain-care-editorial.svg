<title id="title">Separate the reservoir, filter and pump maintenance</title><desc id="desc">A cutaway schematic fountain shows a reservoir, filter and submerged pump. It emphasizes checking exact replacement parts, following the cleaning instructions, and retaining a separate water bowl.</desc>
<text x="70" y="95" class="title">Three parts of fountain care</text><text x="70" y="140" class="sub">A filter and a large reservoir do not remove the cleaning routine.</text>
