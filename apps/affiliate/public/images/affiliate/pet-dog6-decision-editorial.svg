<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">DOG 6: connect the whole recovery plan</title><desc id="desc">Diagram separating GPS position, cellular delivery and an active paid plan. Check the actual route, full billed term and received model.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153c37}.title{font-size:40px;font-weight:700}.label{font-size:25px;font-weight:700;fill:#2a7067}.body{font-size:28px}.small{font-size:23px}.large{font-size:43px;font-weight:700}.line{fill:none;stroke:#2a7067;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.box{fill:white;stroke:#cbbdbd;stroke-width:2}.accent{fill:#2a7067}</style><rect width="900" height="560" rx="20" fill="#f3f9f6"/><text x="40" y="45" class="label">EDITORIAL DECISION DIAGRAM</text><text x="40" y="105" class="title">DOG 6: three checks before relying on it</text><g><rect x="40" y="150" width="250" height="235" rx="14" class="box"/><text x="65" y="195" class="label">1 • THE DOG</text><text x="65" y="245" class="body">Exact DOG 6</text><text x="65" y="287" class="body">Collar fit</text><text x="65" y="329" class="body">Charging routine</text></g><path d="M302 265h32m-11-11 11 11-11 11" class="line"/><rect x="345" y="150" width="245" height="235" rx="14" class="box"/><text x="370" y="195" class="label">2 • THE ROUTE</text><text x="370" y="245" class="body">GPS reception</text><text x="370" y="287" class="body">Cellular delivery</text><text x="370" y="329" class="body">Position age</text><path d="M602 265h32m-11-11 11 11-11 11" class="line"/><rect x="645" y="150" width="215" height="235" rx="14" class="box"/><text x="670" y="195" class="label">3 • THE PLAN</text><text x="670" y="245" class="body">Billed term</text><text x="670" y="287" class="body">Renewal</text><text x="670" y="329" class="body">Response</text><text x="40" y="448" class="body">Phone signal alone does not establish tracker coverage.</text><text x="40" y="487" class="body">Keep suitable containment and an ordinary recovery plan.</text><text x="40" y="529" class="small">Documentation guide • not a product photograph or hands-on test</text></svg>
